name: Dependency floors

# Every @orangecheck range a package declares must hold what it imports at its
# floor (scripts/check-dep-floors.mjs). Runs when a manifest, a lockfile or a
# source file changes, and daily, since a release in range is read too.

on:
    push:
        branches: [main]
        paths:
            - '*/package.json'
            - '*/yarn.lock'
            - '*/src/**'
            - 'package.json'
            - 'yarn.lock'
            - 'scripts/check-dep-floors*.mjs'
            - '.github/workflows/dep-floors.yml'
    pull_request:
        branches: [main]
        paths:
            - '*/package.json'
            - '*/yarn.lock'
            - '*/src/**'
            - 'package.json'
            - 'yarn.lock'
            - 'scripts/check-dep-floors*.mjs'
            - '.github/workflows/dep-floors.yml'
    schedule:
        - cron: '17 6 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: dep-floors-${{ github.ref }}
    cancel-in-progress: true

jobs:
    floors:
        name: Dependency floors hold what each package imports
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
            # TypeScript's parser, from the root's own lockfile.
            - run: yarn install --frozen-lockfile
            - run: node --test scripts/check-dep-floors.test.mjs
            - run: node scripts/check-dep-floors.mjs
