name: Dependency floors

# Every @orangecheck range a package declares must hold what it imports at its
# floor (scripts/check-dep-floors.mjs). The check that packed files load only
# installed packages runs after each build (packages.yml, release.yml); its
# tests run here.

on:
    # On pushes, pull requests and the merge queue it runs as a job of
    # packages.yml; here it reruns daily, since a release in range is read too.
    schedule:
        - cron: '17 6 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: dep-floors-${{ github.ref }}
    cancel-in-progress: true

jobs:
    floors:
        name: Dependency floors hold what each package imports
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
            # TypeScript's parser, from the root's own lockfile.
            - run: yarn install --frozen-lockfile
            - run: node --test scripts/check-dep-floors.test.mjs scripts/check-packed-imports.test.mjs
            - run: node scripts/check-dep-floors.mjs
