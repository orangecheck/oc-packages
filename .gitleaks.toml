# gitleaks: the default rules, minus what this repo publishes on purpose.
[extend]
useDefault = true

[[allowlists]]
description = "me-client's integrator test vectors: tv-session tokens and the fixed test secrets that sign them"
paths = ['''^me-client/test-vectors/''', '''^me-client/scripts/gen-integrator-vectors\.mjs$''']

[[allowlists]]
description = "Project keys (pk_test_, pk_live_) identify a project in public pages; they are not secrets"
regexes = ['''^pk_(?:test|live)_[A-Za-z0-9_-]+(?:\.\.\.|…)?$''']

[[allowlists]]
description = "vault-core's blob-format vectors: a throwaway vault key, passphrases and a device key that open only the test blobs beside them"
paths = ['''^vault-core/vectors/blob-v1\.json$''']

[[allowlists]]
description = "mcp's test fixtures: the domain-verification tokens ochk.io and the onboarding examples publish in DNS and a meta tag"
condition = "AND"
paths = ['''^mcp/src/__tests__/replay\.ts$''']
regexTarget = "line"
regexes = ['''export const (?:EXAMPLES_TOKEN|OCHK_TXT_TOKEN) = '[0-9a-f]{48}';$''']

[[allowlists]]
description = "auth-client's passkey binding fixture: credential_key is the SHA-256 of the empty string, a statement line, not a key"
condition = "AND"
paths = ['''^auth-client/src/__tests__/webauthn-passkey\.test\.tsx$''']
regexTarget = "line"
regexes = ['''^\s*'credential_key: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855\\n' \+$''']

[[allowlists]]
description = "keys' vectors: identity, wallet and issuer secrets derived from published labels, burn keys that open only the test copies beside them"
paths = ['''^keys/test-vectors/keys-v1\.json$''']

[[allowlists]]
description = "compat's custody-record fixture: a published t tag names a Bitcoin address after oc-attest-key:, which is public, not a key"
condition = "AND"
paths = ['''^compat/fixtures/custody-records\.json$''']
regexTarget = "line"
regexes = ['''^\s*"oc-attest-key:bc1[02-9ac-hj-np-z]{11,71}"$''']
